[workspace]
# Configure release-plz to work with cargo-dist

# Update dependencies
dependencies_update = false

# Changelog settings
changelog_update = true

# Release settings
git_release_enable = true
git_tag_enable = true

# PR settings
pr_name = "chore: release v{{ version }}"
pr_labels = ["release"]

[[package]]
name = "dough"

# Changelog settings for the package
changelog_include = ["feat", "fix", "perf"]
changelog_path = "./CHANGELOG.md"