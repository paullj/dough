# git-cliff configuration for changelog generation
# https://git-cliff.org/docs/configuration

[changelog]
# Header for the entire changelog
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# Body template for the changelog
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
# Remove the leading and trailing whitespace from the template
trim = true
# Footer template for the changelog
footer = """
<!-- generated by git-cliff -->
"""

[git]
# Parse the commits based on conventional commits
conventional_commits = true
# Filter out commits that are not conventional
filter_unconventional = false
# Process each line of a commit for links
split_commits = false
# Regex for parsing conventional commit types
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^style", group = "Style" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore", group = "Miscellaneous Tasks" },
  { message = "^revert", group = "Reverts" },
  { message = "^build", group = "Build System" },
  { message = "^ci", group = "Continuous Integration" },
]
# Protect against breaking changes
protect_breaking_commits = false
# Filter commits by paths
filter_commits = false
# Tag pattern for releases
tag_pattern = "v[0-9]*"
# Skip tags matching this regex
skip_tags = ""
# Ignore tags matching this regex
ignore_tags = ""
# Sort the tags chronologically
topo_order = false
# Sort the commits inside sections by oldest/newest order
sort_commits = "oldest"